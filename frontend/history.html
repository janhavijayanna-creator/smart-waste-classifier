<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Prediction History</title>

<link
rel="stylesheet"
href="css/style.css">

</head>

<body>

<header class="navbar">

<div class="brand">

Smart Waste Classifier

</div>

<nav>

<a href="index.html">

Dashboard

</a>

<a href="predict.html">

Predict

</a>

<a
href="history.html"
class="active">

History

</a>

</nav>

</header>

<main class="container">

<div class="section-heading">

<div>

<p class="eyebrow">

PREDICTION HISTORY

</p>

<h2>

Saved Predictions

</h2>

</div>

<div>

<button
id="exportButton"
class="secondary-button">

Export CSV

</button>

<button
id="clearButton"
class="primary-button">

Clear History

</button>

</div>

</div>

<input
type="text"
id="searchInput"
placeholder="Search prediction..."
style="
width:100%;
padding:12px;
margin-bottom:20px;
border-radius:10px;
border:1px solid #ccc;
">

<div class="history-table">

<table>

<thead>

<tr>

<th>File</th>

<th>Prediction</th>

<th>Confidence</th>

<th>Date</th>

<th>Action</th>

</tr>

</thead>

<tbody id="historyTable">

<tr>

<td colspan="5">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</main>

<script src="js/history.js"></script>

</body>

</html>
