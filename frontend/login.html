<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Smart Waste Classifier</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body class="auth-page">

    <main class="auth-wrapper">

        <section class="auth-brand-panel">
            <p class="eyebrow auth-eyebrow">
                SMART RECYCLING
            </p>

            <h1>
                Welcome back
            </h1>

            <p>
                Sign in to classify waste, use the webcam,
                and view your private prediction history.
            </p>
        </section>

        <section class="auth-card">

            <h2>Login</h2>

            <p class="auth-subtitle">
                Enter your account details.
            </p>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    autocomplete="email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <div class="password-field">
                    <input
                        type="password"
                        id="loginPassword"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="loginPassword"
                    >
                        Show
                    </button>
                </div>

                <p
                    id="loginMessage"
                    class="form-message"
                ></p>

                <button
                    type="submit"
                    class="auth-button"
                    id="loginButton"
                >
                    Login
                </button>

            </form>

            <p class="auth-switch">
                New user?
                <a href="register.html">
                    Create an account
                </a>
            </p>

        </section>

    </main>

    <script src="js/auth.js"></script>

</body>
</html>
