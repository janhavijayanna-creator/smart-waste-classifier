<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Smart Waste Classifier</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body class="auth-page">

    <main class="auth-wrapper">

        <section class="auth-brand-panel">
            <p class="eyebrow auth-eyebrow">
                PERSONAL DASHBOARD
            </p>

            <h1>
                Start classifying smarter
            </h1>

            <p>
                Create an account and receive a fresh,
                private dashboard with zero prediction history.
            </p>
        </section>

        <section class="auth-card">

            <h2>Create Account</h2>

            <p class="auth-subtitle">
                Your prediction history will remain private.
            </p>

            <form id="registerForm">

                <label for="registerName">
                    Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    autocomplete="name"
                    minlength="2"
                    required
                >

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    autocomplete="email"
                    required
                >

                <label for="registerPassword">
                    Password
                </label>

                <div class="password-field">
                    <input
                        type="password"
                        id="registerPassword"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="registerPassword"
                    >
                        Show
                    </button>
                </div>

                <p
                    id="registerMessage"
                    class="form-message"
                ></p>

                <button
                    type="submit"
                    class="auth-button"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>

            <p class="auth-switch">
                Already registered?
                <a href="login.html">
                    Login
                </a>
            </p>

        </section>

    </main>

    <script src="js/auth.js"></script>

</body>
</html>
